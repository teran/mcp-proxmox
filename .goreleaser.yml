# goreleaser configuration for mcp-proxmox.
# Validate with: goreleaser check
version: 2

project_name: mcp-proxmox

before:
  hooks:
    - go mod tidy

builds:
  - id: mcp-proxmox
    main: ./cmd/mcp-proxmox
    binary: mcp-proxmox
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.appName={{ .ProjectName }}
        -X main.appVersion={{ .Version }}
        -X main.appCommitHash={{ .ShortCommit }}
        -X main.appTimestamp={{ .Date }}
        -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: mcp-proxmox
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
