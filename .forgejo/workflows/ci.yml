# Forgejo Actions workflow for mcp-proxmox (format compatible with GitHub Actions).
#
# Goal: test every push/PR, and build + create a release on tags.
#   test    — runs on every push and PR (all branches): build, vet, gofmt,
#             hermetic tests, golangci-lint, go-arch-lint
#   release — runs only on tag pushes (refs/tags/*): builds the binary and
#             publishes it as a Forgejo release
#
# Container image: golang:1.27 matches the toolchain used locally and satisfies
# the `go 1.27.0` directive in go.mod.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: docker
    container:
      image: golang:1.27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for the following files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (with -race)
        run: go test -race ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Lint (golangci-lint)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          golangci-lint run ./...

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest

      - name: Architecture check (go-arch-lint)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go-arch-lint check

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Security scan (gosec)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gosec ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability check (govulncheck)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          govulncheck ./...

      - name: Coverage gate (>= 95%)
        run: |
          go test ./... -coverprofile=coverage.out
          awk '!/\/cmd\/mcp-proxmox\//' coverage.out > coverage-core.out
          cov=$(go tool cover -func=coverage-core.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "cover-core: ${cov}%"
          if ! awk -v c="$cov" 'BEGIN { exit !(c >= 95) }'; then
            echo "coverage ${cov}% is below the 95% gate"
            exit 1
          fi

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: Mutation testing (gremlins) — HARD GATE
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gremlins unleash --workers 4 --timeout-coefficient 50 ./application -E '.*mocks.*'
          gremlins unleash --workers 4 --timeout-coefficient 50 ./domain
        # NOTE: no continue-on-error — surviving mutants fail the build (SPEC C7/C8).

  release:
    name: Release
    # Only on tag pushes. In Forgejo Actions github.ref works the same as in
    # GitHub Actions (refs/tags/<tag> for tag pushes).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker
    container:
      image: golang:1.27
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build binary
        run: |
          mkdir -p dist
          VERSION="$(git describe --tags --exact-match 2>/dev/null || echo v0.0.0-dev)"
          COMMIT="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X main.appName=mcp-proxmox \
              -X main.appVersion=${VERSION} \
              -X main.appCommitHash=${COMMIT} \
              -X main.appTimestamp=${TS} \
              -X main.version=${VERSION}" -o dist/mcp-proxmox ./cmd/mcp-proxmox

      - name: Create Forgejo release
        uses: https://code.forgejo.org/forgejo/release@v2
        with:
          files: dist/mcp-proxmox
          gitea_token: ${{ secrets.GITHUB_TOKEN }}
