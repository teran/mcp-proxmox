# Forgejo Actions workflow for mcp-proxmox (format compatible with GitHub Actions).
#
# All jobs bind to the standard build-system interface (R07) via `make`
# targets, so the same targets work across CI providers (GitLab + Forgejo).
#
# Goal: test every push/PR, and build + create a release on tags.
#   test    — runs on every push and PR (all branches): make lint, make test,
#             make mutation (gremlins hard gate), gitleaks secret scan
#   release — runs only on tag pushes (refs/tags/*): builds the binary and
#             publishes it as a Forgejo release
#
# This is a Local (stdio-only) server: no e2e / container-image targets are
# declared (N31 — a CI job never invokes an undeclared optional target).
#
# Container image: golang:1.27 matches the toolchain used locally and satisfies
# the `go 1.27.1` directive in go.mod.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: docker
    container:
      image: golang:1.27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          # gitleaks is a static binary; download the release matching the
          # architecture instead of building from source (it pins its own Go
          # toolchain). See https://github.com/gitleaks/gitleaks/releases
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) GITLEAKS_ARCH="x64" ;;
            aarch64|arm64) GITLEAKS_ARCH="arm64" ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${GITLEAKS_ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan over git history (gitleaks) — HARD GATE
        run: |
          # C3/N28: scan the FULL history; findings must be fixed, not
          # suppressed. No continue-on-error — leaks fail the build.
          gitleaks detect --source . --redact --verbose

      - name: Install lint/arch/sec/vuln/mutation tools
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install github.com/fe3dback/go-arch-lint@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: Lint (make lint)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lint

      - name: Test + coverage (make test)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make test

      - name: Mutation testing (make mutation) — HARD GATE
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make mutation
        # NOTE: no continue-on-error — surviving mutants fail the build (SPEC C7/C8).

  release:
    name: Release
    # Only on tag pushes. In Forgejo Actions github.ref works the same as in
    # GitHub Actions (refs/tags/<tag> for tag pushes).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker
    container:
      image: golang:1.27
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single Linux binary (goreleaser single-target)
        run: |
          # Dedicated release step (B01): goreleaser produces the single
          # release binary with build metadata embedded via ldflags
          # (.goreleaser.yml). --single-target avoids the full multi-platform
          # matrix; --output places it at dist/mcp-proxmox for the release.
          export PATH="$PATH:$(go env GOPATH)/bin"
          goreleaser build --snapshot --clean --single-target \
            --id mcp-proxmox --output dist/mcp-proxmox

      - name: Create Forgejo release
        uses: https://code.forgejo.org/forgejo/release@v2
        with:
          files: dist/mcp-proxmox
          gitea_token: ${{ secrets.GITHUB_TOKEN }}
