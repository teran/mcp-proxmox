# GitLab CI/CD pipeline for mcp-proxmox.
#
# All jobs bind to the standard build-system interface (R07) via `make`
# targets, so the same targets work across CI providers (GitLab + Forgejo).
#
# Stages:
#   lint    — make lint (golangci-lint, vet, gofmt, go-arch-lint, gosec, govulncheck)
#   test    — make test (hermetic -race tests + coverage >= 95% gate) on EVERY commit
#   mutation— make mutation (gremlins) as a HARD gate (fails on survivors)
#   secrets — make secrets (gitleaks over the full git history) as a HARD gate
#   build   — make build (goreleaser snapshot) on master and MRs
#   release — goreleaser release on tags
#
# This is a Local (stdio-only) server: no e2e / container-image targets are
# declared (N31 — a CI job never invokes an undeclared optional target).
stages:
  - lint
  - test
  - mutation
  - secrets
  - build
  - release

variables:
  GORELEASER_PROJECT_NAME: mcp-proxmox

lint:
  stage: lint
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - make lint
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - make test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Mutation testing (gremlins) is a HARD gate: survivors fail the build
# (SPEC.md C7/C8, N15/N19). No allow_failure / continue-on-error here.
mutation:
  stage: mutation
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - make mutation
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Secret scan over the FULL git history (SPEC.md C3/N28). Findings must be
# fixed, never suppressed. Hard gate — no allow_failure / continue-on-error.
# Runs in the dedicated gitleaks image (has gitleaks but no make), so it
# invokes gitleaks directly; this is a dedicated hard-gate job, not part of
# the standard 5-target interface (R07).
secrets:
  stage: secrets
  image: zricethezav/gitleaks:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - gitleaks detect --source . --redact --verbose
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-master:
  stage: build
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - make build
  artifacts:
    name: ${GORELEASER_PROJECT_NAME}
    paths:
      - dist/**
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

build-mr:
  stage: build
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - make build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

release:
  stage: release
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG
  dependencies: []
