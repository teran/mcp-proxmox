# GitLab CI/CD pipeline for mcp-proxmox.
#
# Stages:
#   lint    — static analysis on master and MRs
#   test    — hermetic unit tests on EVERY commit (any branch + MR)
#   mutation— gremlins mutation testing as a HARD gate (fails on survivors)
#   secrets — gitleaks secret scan over the full git history (HARD gate, C3/N28)
#   build   — goreleaser snapshot build on master and MRs
#   release — goreleaser release on tags
stages:
  - lint
  - test
  - mutation
  - secrets
  - build
  - release

variables:
  GORELEASER_PROJECT_NAME: mcp-proxmox

lint:
  stage: lint
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - golangci-lint run ./...
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  stage: test
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - go test -race ./...
    - go vet ./...
    - gofmt -l .
    - golangci-lint run ./...
    - go-arch-lint check
    - gosec ./...
    - govulncheck ./...
    - |
      go test ./... -coverprofile=coverage.out
      awk '!/\/cmd\/mcp-proxmox\//' coverage.out > coverage-core.out
      cov=$(go tool cover -func=coverage-core.out | tail -1 | awk '{print $NF}' | tr -d '%')
      echo "cover-core: ${cov}%"
      if ! awk -v c="$cov" 'BEGIN { exit !(c >= 95) }'; then
        echo "coverage ${cov}% is below the 95% gate"; exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Mutation testing (gremlins) is a HARD gate: survivors fail the build
# (SPEC.md C7/C8, N15/N19). No allow_failure / continue-on-error here.
mutation:
  stage: mutation
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - gremlins unleash --workers 4 --timeout-coefficient 50 ./application -E '.*mocks.*'
    - gremlins unleash --workers 4 --timeout-coefficient 50 ./domain
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Secret scan over the FULL git history (SPEC.md C3/N28). Findings must be
# fixed, never suppressed. Hard gate — no allow_failure / continue-on-error.
secrets:
  stage: secrets
  image: zricethezav/gitleaks:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - gitleaks detect --source . --redact --verbose
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-master:
  stage: build
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - goreleaser build --snapshot --clean
  artifacts:
    name: ${GORELEASER_PROJECT_NAME}
    paths:
      - dist/**
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

build-mr:
  stage: build
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - goreleaser build --snapshot --clean
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

release:
  stage: release
  image: harbor.hosting.reg.ru/cloud-platform-api/infra/cicd/ci:latest
  tags:
    - cloud-infra-runner.msk1
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG
  dependencies: []
