# GitHub Actions CI for mcp-proxmox.
#
# Every job binds to the standard build-system interface (R07) via `make`
# targets (`make lint` / `make test` / `make build`), so the same targets work
# across CI providers. gremlins (mutation, C08GO) and gitleaks (secret scan,
# C03) stay as DEDICATED hard-gate steps/jobs — they are NOT part of the
# standard 5-target interface (R07).
#
# Gates enforced here:
#   lint     — make lint (golangci-lint, vet, gofmt, go-arch-lint, gosec, govulncheck)
#   test     — make test (hermetic -race tests + coverage >= 95% hard gate)
#   mutation — make mutation (gremlins 80/80) as a HARD GATE (fails on survivors)
#   secrets  — make secrets (gitleaks over the FULL git history) as a HARD GATE
#   build    — make build (goreleaser snapshot -> dist/)
#   e2e      — make e2e (harness-backed suite; //go:build e2e) on a runner with
#              Docker. OPTIONAL, not part of the standard 5-target interface (R07),
#              and NOT run in the default `go test ./...` pass.
#
# This is a Local (stdio-only) server with an OPTIONAL, harness-backed e2e
# target (runs an in-repo Proxmox emulator in a container and drives the real
# server over stdio). There is no CI-published container image, so no image
# job is declared (N31 — a CI job never invokes an undeclared optional target).
name: CI

# Run the full suite once per change:
#   - push to the default branch (master) and tags
#   - every pull_request
# Feature branches are covered by pull_request, so a push that becomes a PR
# does NOT run the pipeline twice.
on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27"             # keep in sync with go.mod (go 1.27.1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================ Lint (make lint) ============================
  lint:
    name: lint (make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: install lint/arch/sec/vuln tools
        run: |
          # golangci-lint >= v2.14.0 bundles x/tools >= v0.50.0, which is required
          # to read Go 1.27.x export data (version V5). v2.13.1 (x/tools v0.49.0,
          # max V4) fails to typecheck stdlib under `go 1.27.1` in go.mod.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/fe3dback/go-arch-lint@latest
          # gosec must be built with x/tools >= v0.50.0 to read Go 1.27.x export
          # data (version V5). The latest RELEASE (v2.29.0) bundles x/tools
          # v0.49.0 (max V4) and fails to typecheck any package under `go 1.27.x`,
          # so we pin to a master pseudo-version that bumps x/tools to v0.51.0.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261009120814-7b1b5cebe007
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Lint (make lint)
        run: make lint

  # ====================== Test + coverage (make test) =======================
  # `make test` runs the unit suite with -race + the >= 95% cover-core hard gate
  # (C1). Fails the build below the threshold.
  test:
    name: "tests (make test: -race + coverage >=95%)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: Test + coverage gate (make test)
        run: make test

  # =============== Mutation testing (make mutation) — HARD GATE =============
  # gremlins, --threshold-efficacy=80 --threshold-mcover=80. No continue-on-error
  # — surviving mutants or below-threshold score fail the build (C2/C08GO, N15).
  mutation:
    name: gremlins (make mutation) — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Mutation gate (make mutation)
        run: make mutation

  # ==================== Secret scan (make secrets) — HARD GATE ==============
  # gitleaks over the FULL git history (fetch-depth: 0). No continue-on-error —
  # leaks fail the build (C3/N28). Dedicated hard-gate job, not part of the
  # standard 5-target interface (R07).
  secrets:
    name: gitleaks (make secrets) — secret scan over full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) GITLEAKS_ARCH="x64" ;;
            aarch64|arm64) GITLEAKS_ARCH="arm64" ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${GITLEAKS_ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Secret scan (make secrets)
        run: make secrets

  # ====================== Build (make build -> dist/) =======================
  # `make build` runs goreleaser snapshot producing the single artifact in
  # dist/ for all intended platforms (B01/B02). Validates the R07 build target.
  build:
    name: build (make build -> dist/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          install-only: true
      - name: Build (make build)
        run: make build

  # ====================== E2E (make e2e, needs Docker) ======================
  # Harness-backed end-to-end suite (//go:build e2e): builds the in-repo Proxmox
  # emulator for linux, runs it in a Docker container via go-docker-testsuite,
  # builds the real server and drives it over stdio against the emulator.
  # Requires Docker (ubuntu-latest has it). NOT part of the standard 5-target
  # interface (R07) and not run in the default `go test ./...` pass.
  e2e:
    name: "e2e (make e2e, needs Docker)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: E2E (make e2e)
        run: make e2e
