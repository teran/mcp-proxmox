# GitHub Actions CI for mcp-proxmox.
#
# Every job binds to the standard build-system interface (R07) via `make`
# targets (`make lint` / `make test` / `make build`), so the same targets work
# across CI providers. gremlins (mutation, C08GO) and gitleaks (secret scan,
# C03) stay as DEDICATED hard-gate steps/jobs — they are NOT part of the
# standard 5-target interface (R07).
#
# Gates enforced here:
#   lint     — make lint (golangci-lint, vet, gofmt, go-arch-lint, gosec, govulncheck)
#   test     — make test (hermetic -race tests + coverage >= 95% hard gate)
#   mutation — make mutation (gremlins 80/80) as a HARD GATE (fails on survivors)
#   secrets  — make secrets (gitleaks over the FULL git history) as a HARD GATE
#   build    — make build (goreleaser snapshot -> dist/)
#
# This is a Local (stdio-only) server: there is no end-to-end test suite and no
# CI-published container image, so no optional jobs for them are declared
# (N31 — a CI job never invokes an undeclared optional target).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27"             # keep in sync with go.mod (go 1.27.1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================ Lint (make lint) ============================
  lint:
    name: lint (make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: install lint/arch/sec/vuln tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install github.com/fe3dback/go-arch-lint@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Lint (make lint)
        run: make lint

  # ====================== Test + coverage (make test) =======================
  # `make test` runs the unit suite with -race + the >= 95% cover-core hard gate
  # (C1). Fails the build below the threshold.
  test:
    name: "tests (make test: -race + coverage >=95%)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: Test + coverage gate (make test)
        run: make test

  # =============== Mutation testing (make mutation) — HARD GATE =============
  # gremlins, --threshold-efficacy=80 --threshold-mcover=80. No continue-on-error
  # — surviving mutants or below-threshold score fail the build (C2/C08GO, N15).
  mutation:
    name: gremlins (make mutation) — HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Mutation gate (make mutation)
        run: make mutation

  # ==================== Secret scan (make secrets) — HARD GATE ==============
  # gitleaks over the FULL git history (fetch-depth: 0). No continue-on-error —
  # leaks fail the build (C3/N28). Dedicated hard-gate job, not part of the
  # standard 5-target interface (R07).
  secrets:
    name: gitleaks (make secrets) — secret scan over full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) GITLEAKS_ARCH="x64" ;;
            aarch64|arm64) GITLEAKS_ARCH="arm64" ;;
            *) echo "unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${GITLEAKS_ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Secret scan (make secrets)
        run: make secrets

  # ====================== Build (make build -> dist/) =======================
  # `make build` runs goreleaser snapshot producing the single artifact in
  # dist/ for all intended platforms (B01/B02). Validates the R07 build target.
  build:
    name: build (make build -> dist/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: --version
      - name: Build (make build)
        run: make build
